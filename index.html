<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BubGrub</title><style id="css">
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1b19;--mute:#6f6a63;--acc:#00a082;--line:#e8e2d8;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#222120;--ink:#f3efe8;--mute:#a09a90;--acc:#2cc4a4;--line:#333130;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--card:#222120;--ink:#f3efe8;--mute:#a09a90;--acc:#2cc4a4;--line:#333130;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Helvetica Neue",sans-serif;padding-bottom:110px}
header{padding:28px 20px 12px;max-width:720px;margin:auto}
h1{margin:0;font-size:28px;letter-spacing:-.5px}header p{margin:4px 0 0;color:var(--mute)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 20px;max-width:720px;margin:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg)}
main{max-width:720px;margin:auto;padding:8px 20px;display:grid;gap:14px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.dish{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pic{width:120px;min-height:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--line) center/cover}
.info{padding:12px 12px 12px 0;flex:1;display:flex;flex-direction:column}
.info h3{margin:0 0 4px;font-size:17px}.info p{margin:0;color:var(--mute);font-size:14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.eta{font-size:13px;color:var(--mute)}
.add,.qty button{border:0;background:var(--acc);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.qty{display:flex;align-items:center;gap:10px}.qty span{min-width:14px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.btn{display:block;width:100%;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:600;padding:14px;border-radius:12px}
.bar .btn{max-width:720px;margin:auto}.btn:disabled{opacity:.4}
.btn.ghost{background:none;color:var(--mute);font-weight:500;margin-top:6px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.adm{max-width:720px;margin:0 auto;padding:4px 20px;display:flex;gap:8px;flex-wrap:wrap}
.adm .btn{width:auto;padding:9px 14px;font-size:14px}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px}
.mini.del{color:var(--bad)}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px}dialog ul{padding-left:18px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;margin:5px 0}
#prev{width:100%;height:160px;border-radius:12px;background:var(--line) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mute);margin-bottom:6px}
#msg{color:var(--mute);font-size:13px;min-height:18px}[hidden]{display:none!important}#fbt{text-align:center;font-weight:600;margin:14px 0 4px}#ob{position:absolute;opacity:0;width:1px;height:1px;padding:0;margin:0;border:0;pointer-events:none}

const S=JSON.parse(document.getElementById("state").textContent);
const SK=`<header><h1>BubGrub 🍳</h1><p>What is pahp in the mood for?</p></header>
<input type="file" id="bulk" accept="image/*" multiple hidden><div class="adm" id="adm" hidden></div><div class="tabs" id="tabs"></div><main id="menu"></main>
<div class="bar"><button class="btn" id="go" disabled>View order</button></div>
<dialog id="dlg"><h2 id="dh">Your order</h2><ul id="sum"></ul>
<textarea id="note" rows="2" placeholder="Any special requests? (extra cheese, no onions…)"></textarea>
<button class="btn" id="send">Place order 💌</button>
<div id="fb" hidden><p id="fbt"></p><textarea id="ob" rows="5" readonly></textarea><button class="btn" id="cp">Copy order</button></div>
<button class="btn ghost" id="close">Back to menu</button></dialog>
<dialog id="ed"><h2 id="edt">Add a dish</h2>
<div id="prev">Tap to choose a photo</div><input type="file" id="file" accept="image/*">
<input id="fn" placeholder="Dish name"><textarea id="fd" rows="2" placeholder="Short description"></textarea>
<input id="fc" list="cats" placeholder="Category (Mains, Brunch, Sweet…)"><datalist id="cats"></datalist>
<input id="ft" placeholder="Cooking time (e.g. 30 min)"><div id="msg"></div>
<button class="btn" id="fs">Save dish</button><button class="btn ghost" id="fx">Cancel</button></dialog>`;
const $=id=>document.getElementById(id);
$("app").innerHTML=SK;
const cart={};let cat="All",edit=false,canEdit=false,art=null,cur=null,curImg="";
const uid=()=>Math.random().toString(36).slice(2,9);
function cats(){return[...new Set(S.dishes.map(x=>x.c||"Other"))]}
function tabs(){const t=$("tabs");t.innerHTML="";const cs=cats();if(cs.length<2){cat="All";return}
 ["All",...cs].forEach(c=>{const b=document.createElement("button");b.className="tab"+(c===cat?" on":"");b.textContent=c;b.onclick=()=>{cat=c;tabs();menu()};t.append(b)})}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function menu(){const m=$("menu");m.innerHTML="";
 if(!S.dishes.length){m.append(el("div","empty",canEdit?"No dishes yet. Tap “Edit menu”, then “Add dish”.":"The menu is being prepared. Check back soon! 👨‍🍳"));return}
 S.dishes.forEach(x=>{if(cat!=="All"&&(x.c||"Other")!==cat)return;
  const d=el("div","dish"),pic=el("div","pic");
  if(x.img)pic.style.backgroundImage=`url("${x.img}")`;else pic.textContent="🍽️";
  const info=el("div","info"),r=el("div","row");
  r.append(el("span","eta",x.t?"⏱ "+x.t:""),edit?adm(x):ctl(x.id));
  info.append(el("h3","",x.n),el("p","",x.d||""),r);d.append(pic,info);m.append(d)})}
function adm(x){const w=el("div","qty");
 const e=el("button","mini","Edit");e.onclick=()=>openEd(x);
 const k=el("button","mini del","Delete");k.onclick=()=>{if(confirm("Delete “"+x.n+"”?")){S.dishes=S.dishes.filter(y=>y!==x);save()}};
 w.append(e,k);return w}
function ctl(id){const q=cart[id]||0;
 if(!q){const b=el("button","add","+");b.onclick=()=>{cart[id]=1;upd()};return b}
 const w=el("div","qty"),a=el("button","","−"),b=el("button","","+");
 a.onclick=()=>{cart[id]--;if(!cart[id])delete cart[id];upd()};b.onclick=()=>{cart[id]++;upd()};
 w.append(a,el("span","",q),b);return w}
function upd(){menu();const n=Object.values(cart).reduce((a,b)=>a+b,0);$("go").disabled=!n;$("go").textContent=n?`View order (${n})`:"View order"}
function lines(){return Object.entries(cart).map(([id,q])=>{const d=S.dishes.find(x=>x.id===id);return d?`${q} × ${d.n}`:null}).filter(Boolean)}
$("go").onclick=()=>{$("sum").innerHTML="";lines().forEach(l=>$("sum").append(el("li","",l)));$("sum").hidden=false;$("note").hidden=false;$("dh").textContent="Your order";$("cp").hidden=false;$("cp").textContent="Copy";$("fb").hidden=true;$("send").hidden=false;$("dlg").showModal()};
$("close").onclick=()=>$("dlg").close();
$("send").onclick=()=>{const n=$("note").value.trim();
 const body="Order up! 🍽️\n"+lines().join("\n")+(n?"\nNote: "+n:"");
 $("ob").value=body;try{fetch("https://ntfy.sh/bubgrub-a1dc1aa5078c71ea81d8?title=New%20BubGrub%20order",{method:"POST",body}).catch(()=>{})}catch(e){}
 const o=$("ob");$("fb").hidden=false;let ok=false;
 try{o.focus();o.select();o.setSelectionRange(0,9999);ok=document.execCommand("copy")}catch(e){}
 const fin=g=>{$("fbt").textContent=g?"Copied ✓ Now paste it in Messenger to send to Danny":"Tap Copy, then paste it in Messenger to send to Danny";$("cp").hidden=g};
 if(ok)fin(true);else if(navigator.clipboard)navigator.clipboard.writeText(body).then(()=>fin(true),()=>fin(false));else fin(false);
};
$("cp").onclick=()=>{const o=$("ob");o.focus();o.select();o.setSelectionRange(0,9999);let ok=false;try{ok=document.execCommand("copy")}catch(e){}
 if(!ok&&navigator.clipboard)navigator.clipboard.writeText(o.value).catch(()=>{});$("cp").textContent="Copied ✓"};
function admbar(){const a=$("adm");a.hidden=!canEdit;a.innerHTML="";if(!canEdit)return;
 const t=el("button","btn sec",edit?"Done editing":"✏️ Edit menu");t.onclick=()=>{edit=!edit;admbar();menu()};a.append(t);
 if(edit){const p=el("button","btn","+ Add dish");p.onclick=()=>openEd(null);
  const b2=el("button","btn","📷 Add many photos");b2.onclick=()=>$("bulk").click();
  const n=el("button","btn sec","📱 Orders go to: "+(S.phone||"not set"));
  n.onclick=()=>{const v=prompt("Your mobile number for order texts (with country code, e.g. +447700900123):",S.phone||"");if(v!==null){S.phone=v.trim();save()}};
  a.append(p,b2,n)}}
function openEd(x,img){cur=x;curImg=x?x.img:(img||"");$("fx").textContent=inQ?"Skip photo":"Cancel";$("edt").textContent=x?"Edit dish":"Add a dish";
 $("fn").value=x?x.n:"";$("fd").value=x?x.d||"":"";$("fc").value=x?x.c||"":"";$("ft").value=x?x.t||"":"";$("file").value="";$("msg").textContent="";
 $("cats").innerHTML="";cats().forEach(c=>{const o=document.createElement("option");o.value=c;$("cats").append(o)});
 showPrev();$("fs").disabled=false;if(!$("ed").open)$("ed").showModal()}
function showPrev(){const p=$("prev");p.style.backgroundImage=curImg?`url("${curImg}")`:"";p.textContent=curImg?"":"No photo yet"}
async function shrink(f){let bmp;try{bmp=await createImageBitmap(f)}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
 const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,720/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
 return c.toDataURL("image/jpeg",.74)}
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("msg").textContent="Preparing photo…";
 try{curImg=await shrink(f);showPrev();$("msg").textContent=""}catch(err){$("msg").textContent="Couldn’t read that photo. Try another."}};
let Q=[],added=0,total=0,inQ=false;
function nextQ(){if(!Q.length){inQ=false;$("ed").close();if(added)save();return}
 const i=Q.shift();openEd(null,i);$("edt").textContent="Name this dish ("+(total-Q.length)+" of "+total+")"}
$("fx").onclick=()=>{if(inQ){nextQ();return}$("ed").close()};
$("ed").addEventListener("close",()=>{if(inQ){inQ=false;Q=[];if(added)save()}});
$("bulk").onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
 const bar=$("adm");bar.style.opacity=.5;const imgs=[];
 for(const f of fs){try{imgs.push(await shrink(f))}catch(err){}}
